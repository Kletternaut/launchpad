services:
  launchpad:
    image: larsmikki/launchpad:latest
    container_name: launchpad
    ports:
      - "3020:3020"
    volumes:
      - launchpad-data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3020/api/settings"]
      interval: 5m
      timeout: 10s
      retries: 3

volumes:
  launchpad-data:
